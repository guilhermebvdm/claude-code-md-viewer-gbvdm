<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>md-viewer</title>
<style>
  :root { color-scheme: dark; --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3; --muted: #9da7b3; --accent: #60a5fa; --find: #fbbf24; --header-h: 49px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, "Segoe UI", sans-serif; }
  button { font: inherit; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header #path { flex: 1 1 240px; min-width: 0; padding: 6px 8px; background: var(--bg); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; font: 12px ui-monospace, Consolas, monospace; }
  header #path:focus { color: var(--text); }
  header button { padding: 6px 12px; background: #1e3a5f; color: #dbeafe; border: 1px solid var(--accent); border-radius: 6px; cursor: pointer; font-size: 14px; }
  header button.ghost { background: none; color: var(--muted); border-color: var(--border); font-variant-numeric: tabular-nums; }
  .search { flex: 1.6 1 340px; display: flex; align-items: center; gap: 4px; min-width: 0; padding: 0 4px 0 10px; background: var(--bg); border: 1px solid var(--find); border-radius: 8px; }
  .search:focus-within { box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.25); }
  .search svg { flex: none; color: var(--find); }
  .search input { flex: 1; min-width: 0; padding: 7px 4px; background: none; color: var(--text); border: 0; outline: none; font: 15px system-ui, "Segoe UI", sans-serif; }
  .search .count { flex: none; min-width: 44px; color: var(--muted); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .search .count.none { color: #f87171; }
  .search button { flex: none; padding: 2px 8px; background: none; color: var(--muted); border: 0; border-radius: 4px; }
  .search button:hover { background: var(--panel); color: var(--text); }
  ::highlight(md-search) { background-color: rgba(251, 191, 36, 0.35); }
  ::highlight(md-search-current) { background-color: #fbbf24; color: #0d1117; }
  svg .search-hit { fill: #fbbf24 !important; font-weight: 700; }
  details.search-has-hits > summary { box-shadow: inset 4px 0 0 var(--find); }
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); }
  .layout.no-sidebar { grid-template-columns: minmax(0, 1fr); }
  .layout.no-sidebar aside { display: none; }
  aside { position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); overflow: auto; padding: 0 8px 12px; border-right: 1px solid var(--border); font-size: 14px; }
  aside .filter { position: sticky; top: 0; padding: 12px 0 8px; background: var(--bg); }
  aside .filter input { width: 100%; padding: 6px 8px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font: inherit; }
  aside .filter input:focus { border-color: var(--accent); outline: none; }
  aside .folder { padding: 0 8px 8px; color: var(--muted); font: 12px ui-monospace, Consolas, monospace; word-break: break-all; }
  aside button { display: block; width: 100%; padding: 3px 8px; background: none; color: var(--text); border: 0; border-radius: 4px; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside button:hover, aside button.first { background: var(--panel); }
  aside button.current { background: #1e3a5f; color: #dbeafe; }
  aside button.dir::before { content: "▸ "; color: var(--muted); }
  aside button.up { color: var(--muted); }
  main { min-width: 0; padding: 16px 24px 64px; }
  main [id] { scroll-margin-top: calc(var(--header-h) + 16px); }
  a { color: var(--accent); }
  h1, h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
  code { background: #1f2937; padding: .15em .35em; border-radius: 4px; font: 0.875em ui-monospace, Consolas, monospace; }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  pre.mermaid { text-align: center; cursor: zoom-in; }
  pre.mermaid svg { width: 100%; height: auto; }
  pre.mermaid.natural { cursor: zoom-out; }
  .diagram-error { margin: 1em 0; }
  .diagram-error pre { margin: 8px 0 0; white-space: pre-wrap; }
  .diagram-error summary { cursor: pointer; margin-top: 8px; }
  table { border-collapse: collapse; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; vertical-align: top; }
  th { background: var(--panel); }
  blockquote { margin: 0; padding: 0 1em; border-left: 4px solid var(--border); color: var(--muted); }
  img { max-width: 100%; }
  .notice { color: var(--muted); }
  .error { color: #fecaca; background: #3f1515; border: 1px solid #f87171; border-radius: 6px; padding: 12px; }
  @media (max-width: 720px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    aside { position: static; height: auto; max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--border); }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<header id="header">
  <input id="path" spellcheck="false">
  <button id="open"></button>
  <div class="search" role="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="search" type="search" spellcheck="false" autocomplete="off">
    <span id="search-count" class="count" aria-live="polite"></span>
    <button id="search-prev">↑</button>
    <button id="search-next">↓</button>
  </div>
  <button id="zoom" class="ghost"></button>
  <button id="toggle-list"></button>
</header>
<div class="layout" id="layout">
  <aside>
    <div class="filter"><input id="list-filter" type="search" spellcheck="false" autocomplete="off"></div>
    <div id="list"></div>
  </aside>
  <main id="content"></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.0/dist/mermaid.min.js"></script>
<script>
  const POLL_MS = 2000;
  const SEARCH_DELAY_MS = 120;
  // A diagram fills the width of the reading area, growing to at most this many times its natural size.
  const MAX_UPSCALE = 1.5;
  const ZOOM = { min: 0.5, max: 2.5, keyStep: 0.1, wheelRate: 0.0015, storageKey: 'md-viewer.zoom' };

  const TEXTS = {
    pt: {
      open: 'Abrir', list: 'Lista', placeholder: 'Caminho de um arquivo .md ou de uma pasta', up: '.. pasta acima',
      pick: 'Escolha um arquivo .md na lista ao lado.', empty: 'Nenhum arquivo .md nem pasta aqui.',
      diagramError: 'Erro de sintaxe no diagrama Mermaid', diagramSource: 'Código do diagrama',
      zoomDiagram: 'Clique para alternar entre caber na largura e o tamanho natural',
      search: 'Buscar no documento  (Ctrl+F)', previous: 'Anterior (Shift+Enter)', next: 'Próximo (Enter)',
      filter: 'Filtrar arquivos  (Ctrl+P)', zoom: 'Zoom do documento: Ctrl + roda do mouse, Ctrl + e Ctrl −. Clique para voltar a 100%',
    },
    en: {
      open: 'Open', list: 'List', placeholder: 'Path of a .md file or a folder', up: '.. parent folder',
      pick: 'Pick a .md file in the list.', empty: 'No .md file or folder here.',
      diagramError: 'Mermaid syntax error', diagramSource: 'Diagram source',
      zoomDiagram: 'Click to switch between fit to width and natural size',
      search: 'Search in document  (Ctrl+F)', previous: 'Previous (Shift+Enter)', next: 'Next (Enter)',
      filter: 'Filter files  (Ctrl+P)', zoom: 'Document zoom: Ctrl + mouse wheel, Ctrl + and Ctrl −. Click to reset to 100%',
    },
  };
  const t = navigator.language.toLowerCase().startsWith('pt') ? TEXTS.pt : TEXTS.en;

  const params = new URLSearchParams(location.search);
  const currentFile = params.get('file');
  const $ = (id) => document.getElementById(id);
  const content = $('content');
  const list = $('list');
  const layout = $('layout');
  const pathInput = $('path');
  const searchInput = $('search');
  const searchCount = $('search-count');
  const listFilter = $('list-filter');
  const zoomButton = $('zoom');
  let lastMtime = 0;

  mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'strict' });

  const api = (route, name, value) => fetch(`/api/${route}?${name}=${encodeURIComponent(value)}`).then(async (r) => ({ ok: r.ok, body: await r.json() }));
  const folderOf = (file) => file.replace(/[\\/][^\\/]*$/, '');
  const samePath = (a, b) => a.replace(/\\/g, '/').toLowerCase() === b.replace(/\\/g, '/').toLowerCase();
  const isExternal = (target) => /^[a-z][a-z0-9+.-]*:/i.test(target) || target.startsWith('#');
  const isTyping = (element) => element && (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA' || element.isContentEditable);
  const storage = {
    get: (key) => { try { return localStorage.getItem(key); } catch { return null; } },
    set: (key, value) => { try { localStorage.setItem(key, value); } catch { /* storage blocked: the value lasts for this page only */ } },
  };

  // Opens every collapsed <details> around a node.
  function openAncestors(node) {
    for (let element = node; element; element = element.parentElement) if (element.tagName === 'DETAILS') element.open = true;
  }

  // Lowercase and without accents, so "funcao" finds "função"; map[i] is the offset in the original text of normalized character i.
  function fold(text) {
    let normalized = '';
    const map = [];
    for (let i = 0; i < text.length; i++) {
      for (const ch of text[i].normalize('NFD').replace(/\p{M}/gu, '').toLowerCase()) {
        normalized += ch;
        map.push(i);
      }
    }
    return { normalized, map };
  }

  // ---------- Document ----------

  // Resolves a link or image target relative to the folder of the open document.
  function resolveRelative(target) {
    const resolved = new URL(target, 'file:///' + currentFile.replace(/\\/g, '/'));
    return { path: decodeURIComponent(resolved.pathname.slice(1)), hash: resolved.hash };
  }

  function showError(message) {
    content.replaceChildren(Object.assign(document.createElement('p'), { className: 'error', textContent: message }));
  }

  // Gives headings without an id the same id GitHub gives them, so links such as other.md#some-title work.
  function addHeadingIds() {
    const used = new Set();
    content.querySelectorAll('h1, h2, h3, h4, h5, h6').forEach((heading) => {
      if (heading.id) return;
      const base = heading.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');
      let id = base;
      for (let n = 1; used.has(id); n++) id = `${base}-${n}`;
      used.add(id);
      heading.id = id;
    });
  }

  function reveal(id) {
    const target = document.getElementById(id);
    if (!target) return;
    openAncestors(target);
    target.scrollIntoView();
  }

  async function renderDocument() {
    const { ok, body } = await api('doc', 'file', currentFile);
    if (!ok) return showError(body.error);
    lastMtime = body.mtimeMs;
    document.title = currentFile.split(/[\\/]/).pop();
    content.innerHTML = DOMPurify.sanitize(marked.parse(body.content));
    addHeadingIds();

    content.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
      code.parentElement.replaceWith(Object.assign(document.createElement('pre'), { className: 'mermaid', textContent: code.textContent }));
    });
    content.querySelectorAll('a[href]').forEach((link) => {
      const target = link.getAttribute('href');
      if (target.startsWith('#')) return link.addEventListener('click', () => reveal(decodeURIComponent(target.slice(1))));
      if (isExternal(target)) return link.setAttribute('target', '_blank');
      const { path, hash } = resolveRelative(target);
      if (path.toLowerCase().endsWith('.md')) link.href = '/?file=' + encodeURIComponent(path) + hash;
    });
    content.querySelectorAll('img[src]').forEach((image) => {
      const target = image.getAttribute('src');
      if (!isExternal(target)) image.src = '/raw?file=' + encodeURIComponent(resolveRelative(target).path);
    });

    await renderDiagrams();
  }

  // Shows Mermaid's own message (line and reason) in place of a diagram that does not parse.
  function diagramError(source, message) {
    const box = Object.assign(document.createElement('div'), { className: 'error diagram-error' });
    const details = document.createElement('details');
    details.append(Object.assign(document.createElement('summary'), { textContent: t.diagramSource }), Object.assign(document.createElement('pre'), { textContent: source }));
    box.append(Object.assign(document.createElement('strong'), { textContent: t.diagramError }), Object.assign(document.createElement('pre'), { textContent: message }), details);
    return box;
  }

  // Fits a diagram to the width of the reading area; a click switches to its natural size, with horizontal scrolling.
  function fitToWidth(block) {
    const svg = block.querySelector('svg');
    const naturalWidth = svg.viewBox.baseVal.width;
    if (!naturalWidth) return;
    svg.removeAttribute('height');
    svg.style.maxWidth = `${naturalWidth * MAX_UPSCALE}px`;
    block.title = t.zoomDiagram;
    block.addEventListener('click', () => {
      const natural = block.classList.toggle('natural');
      svg.style.width = natural ? `${naturalWidth}px` : '';
      svg.style.maxWidth = natural ? 'none' : `${naturalWidth * MAX_UPSCALE}px`;
    });
  }

  async function renderDiagrams() {
    const valid = [];
    for (const block of content.querySelectorAll('pre.mermaid')) {
      try {
        await mermaid.parse(block.textContent);
        valid.push(block);
      } catch (error) {
        block.replaceWith(diagramError(block.textContent, String(error.message || error)));
      }
    }
    await mermaid.run({ nodes: valid, suppressErrors: true });
    valid.filter((block) => block.querySelector('svg')).forEach(fitToWidth);
  }

  async function reloadWhenFileChanges() {
    const { ok, body } = await api('mtime', 'file', currentFile);
    if (!ok || body.mtimeMs === lastMtime) return;
    const scroll = window.scrollY;
    const openDetails = [...content.querySelectorAll('details')].map((details) => details.open);
    await renderDocument();
    content.querySelectorAll('details').forEach((details, i) => { if (openDetails[i]) details.open = true; });
    runSearch({ scroll: false });
    window.scrollTo(0, scroll);
  }

  // ---------- Search in the document ----------

  const search = { matches: [], index: -1, timer: 0 };

  function findMatches(query) {
    const needle = fold(query.trim()).normalized;
    if (!needle) return [];
    const matches = [];
    const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
      acceptNode: (node) => (node.nodeValue.trim() && !node.parentElement.closest('style, script') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT),
    });
    for (let node = walker.nextNode(); node; node = walker.nextNode()) {
      const { normalized, map } = fold(node.nodeValue);
      for (let at = normalized.indexOf(needle); at !== -1; at = normalized.indexOf(needle, at + needle.length)) {
        const range = new Range();
        range.setStart(node, map[at]);
        range.setEnd(node, map[at + needle.length - 1] + 1);
        matches.push(range);
      }
    }
    return matches;
  }

  function paintSearch() {
    const { matches, index } = search;
    content.querySelectorAll('.search-hit').forEach((element) => element.classList.remove('search-hit'));
    content.querySelectorAll('details.search-has-hits').forEach((details) => details.classList.remove('search-has-hits'));
    for (const range of matches) {
      for (let element = range.startContainer.parentElement; element; element = element.parentElement) {
        if (element.tagName === 'DETAILS') element.classList.add('search-has-hits');
      }
    }
    if ('highlights' in CSS) {
      CSS.highlights.set('md-search', new Highlight(...matches));
      CSS.highlights.set('md-search-current', new Highlight(...(index >= 0 ? [matches[index]] : [])));
    }
    // Text inside a diagram is not painted by the highlight above, so its element is colored instead.
    if (index >= 0) matches[index].startContainer.parentElement.classList.add('search-hit');
    const hasQuery = Boolean(searchInput.value.trim());
    searchCount.textContent = hasQuery ? `${matches.length ? index + 1 : 0}/${matches.length}` : '';
    searchCount.classList.toggle('none', hasQuery && !matches.length);
  }

  function goToMatch(step) {
    const { matches } = search;
    if (!matches.length) return;
    search.index = (search.index + step + matches.length) % matches.length;
    const element = matches[search.index].startContainer.parentElement;
    openAncestors(element);
    paintSearch();
    element.scrollIntoView({ block: 'center' });
  }

  function runSearch({ scroll = true } = {}) {
    const previous = search.index;
    search.matches = findMatches(searchInput.value);
    search.index = scroll ? -1 : Math.min(previous, search.matches.length - 1);
    if (scroll && search.matches.length) goToMatch(1);
    else paintSearch();
  }

  function focusSearch() {
    searchInput.focus();
    searchInput.select();
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(search.timer);
    search.timer = setTimeout(runSearch, SEARCH_DELAY_MS);
  });
  searchInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      clearTimeout(search.timer);
      if (search.matches.length) goToMatch(event.shiftKey ? -1 : 1);
      else runSearch();
    } else if (event.key === 'Escape') {
      searchInput.value = '';
      runSearch({ scroll: false });
      searchInput.blur();
    }
  });
  $('search-prev').addEventListener('click', () => goToMatch(-1));
  $('search-next').addEventListener('click', () => goToMatch(1));

  // ---------- File list ----------

  async function renderList(dir) {
    const { ok, body } = await api('list', 'dir', dir);
    if (!ok) return list.replaceChildren(Object.assign(document.createElement('p'), { className: 'error', textContent: body.error }));
    const button = (label, className, onClick) => {
      const element = Object.assign(document.createElement('button'), { textContent: label, className, title: label });
      element.addEventListener('click', onClick);
      return element;
    };
    const items = [Object.assign(document.createElement('div'), { className: 'folder', textContent: body.dir })];
    if (body.parent) items.push(button(t.up, 'up', () => renderList(body.parent)));
    for (const entry of body.entries) {
      const element = entry.type === 'dir'
        ? button(entry.name, 'dir', () => { listFilter.value = ''; renderList(entry.path); })
        : button(entry.name, currentFile && samePath(entry.path, currentFile) ? 'current' : '', () => { location.search = '?file=' + encodeURIComponent(entry.path); });
      element.dataset.name = fold(entry.name).normalized;
      items.push(element);
    }
    if (!body.entries.length) items.push(Object.assign(document.createElement('p'), { className: 'notice', textContent: t.empty }));
    list.replaceChildren(...items);
    filterList();
  }

  // Shows only the entries whose name contains the typed text; Enter opens the first one.
  function filterList() {
    const needle = fold(listFilter.value.trim()).normalized;
    let first = null;
    list.querySelectorAll('button[data-name]').forEach((element) => {
      const visible = !needle || element.dataset.name.includes(needle);
      element.hidden = !visible;
      element.classList.remove('first');
      if (visible && !first && needle) first = element;
    });
    first?.classList.add('first');
    return first;
  }

  function focusFilter() {
    layout.classList.remove('no-sidebar');
    listFilter.focus();
    listFilter.select();
  }

  listFilter.addEventListener('input', filterList);
  listFilter.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') filterList()?.click();
    else if (event.key === 'Escape') {
      listFilter.value = '';
      filterList();
      listFilter.blur();
    }
  });

  // ---------- Zoom ----------

  let zoom = Number(storage.get(ZOOM.storageKey)) || 1;

  // Keeps the reading position: the same share of the document stays at the top after the zoom changes.
  function setZoom(value) {
    const next = Math.min(ZOOM.max, Math.max(ZOOM.min, Math.round(value * 100) / 100));
    const share = document.documentElement.scrollHeight ? window.scrollY / document.documentElement.scrollHeight : 0;
    zoom = next;
    content.style.zoom = zoom;
    zoomButton.textContent = `${Math.round(zoom * 100)}%`;
    storage.set(ZOOM.storageKey, String(zoom));
    window.scrollTo(0, share * document.documentElement.scrollHeight);
  }

  window.addEventListener('wheel', (event) => {
    if (!event.ctrlKey) return;
    event.preventDefault();
    setZoom(zoom * Math.exp(-event.deltaY * ZOOM.wheelRate));
  }, { passive: false });
  zoomButton.addEventListener('click', () => setZoom(1));

  // ---------- Keyboard ----------

  document.addEventListener('keydown', (event) => {
    const ctrl = event.ctrlKey || event.metaKey;
    const key = event.key.toLowerCase();
    if (ctrl && key === 'f') { event.preventDefault(); focusSearch(); }
    else if (ctrl && key === 'p') { event.preventDefault(); focusFilter(); }
    else if (ctrl && (key === '=' || key === '+')) { event.preventDefault(); setZoom(zoom + ZOOM.keyStep); }
    else if (ctrl && key === '-') { event.preventDefault(); setZoom(zoom - ZOOM.keyStep); }
    else if (ctrl && key === '0') { event.preventDefault(); setZoom(1); }
    else if (event.key === 'F3') { event.preventDefault(); goToMatch(event.shiftKey ? -1 : 1); }
    else if (event.key === '/' && !isTyping(document.activeElement)) { event.preventDefault(); focusSearch(); }
  });

  // ---------- Start ----------

  // Sticky elements sit below the header, whose height changes when it wraps on a narrow pane.
  new ResizeObserver(() => document.documentElement.style.setProperty('--header-h', `${$('header').offsetHeight}px`)).observe($('header'));

  function openTyped() {
    const value = pathInput.value.trim().replace(/^"|"$/g, '');
    if (value) location.search = (value.toLowerCase().endsWith('.md') ? '?file=' : '?dir=') + encodeURIComponent(value);
  }

  $('open').textContent = t.open;
  $('toggle-list').textContent = t.list;
  pathInput.placeholder = t.placeholder;
  searchInput.placeholder = t.search;
  listFilter.placeholder = t.filter;
  $('search-prev').title = t.previous;
  $('search-next').title = t.next;
  zoomButton.title = t.zoom;
  $('open').addEventListener('click', openTyped);
  pathInput.addEventListener('keydown', (event) => { if (event.key === 'Enter') openTyped(); });
  $('toggle-list').addEventListener('click', () => layout.classList.toggle('no-sidebar'));
  setZoom(zoom);

  const startDir = params.get('dir') || (currentFile && folderOf(currentFile));
  pathInput.value = currentFile || startDir || '';
  if (startDir) renderList(startDir);
  if (currentFile) {
    renderDocument().then(() => {
      if (location.hash) reveal(decodeURIComponent(location.hash.slice(1)));
      setInterval(reloadWhenFileChanges, POLL_MS);
    });
  } else {
    content.replaceChildren(Object.assign(document.createElement('p'), { className: 'notice', textContent: t.pick }));
  }
</script>
</body>
</html>
